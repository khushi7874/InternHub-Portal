<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternHub-Forgot Password</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <a class="navbar-brand d-flex align-items-center" href="home.html">
      <img src="logo.svg" alt="InternHub logo" style="width:40px;">
      <span class="ml-2 text-white font-weight-bold">InternHub</span>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="home.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="login.html">Login</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="register.html">Register</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact.html">Contact</a>
        </li>
        <li class="nav-item active">
          <a class="nav-link" href="forgot-password.html">Forgot Password</a>
        </li>
      </ul>
    </div>
  </nav>
  <div class="container mt-5">
    <div class="form-card mx-auto" style="max-width: 520px;">
      <h2 class="text-center">Forgot Password</h2>
      <p class="text-center text-muted">Enter your email address and we will send you instructions to reset your password.</p>
      <form class="mt-4">
        <div class="form-group">
          <label for="resetEmail">Email address:</label>
          <input id="resetEmail" type="email" class="form-control" placeholder="Enter email" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        <p class="text-center mt-3 mb-0">Remembered your password? <a href="login.html" class="text-primary">Login</a></p>
      </form>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
