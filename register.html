<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternHub-Registration</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="register-page">
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <a class="navbar-brand d-flex align-items-center" href="home.html">
      <img src="logo.svg" alt="InternHub logo" style="width:40px;">
      <span class="ml-2 text-white font-weight-bold">InternHub</span>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="home.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="login.html">Login</a>
        </li>
        <li class="nav-item active">
          <a class="nav-link" href="register.html">Register</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact.html">Contact</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="forgot-password.html">Forgot Password</a>
        </li>
      </ul>
    </div>
  </nav>
<div class="container mt-5">
  <div class="form-card mx-auto">
    <h2 class="text-center">Register</h2>
    <form class="mt-4">
      <div class="form-group">
        <label for="fullName">Full Name:</label>
        <input id="fullName" type="text" class="form-control" placeholder="Enter full name" required>
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input id="email" type="email" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="form-group">
        <label for="mobileNumber">Mobile Number:</label>
        <input id="mobileNumber" type="tel" class="form-control" placeholder="Enter mobile number" required>
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth:</label>
        <input id="dob" type="date" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="educationDetails">Education Details:</label>
        <input id="educationDetails" type="text" class="form-control" placeholder="Enter education details">
      </div>
      <div class="form-group">
        <label for="collegeName">College Name:</label>
        <input id="collegeName" type="text" class="form-control" placeholder="Enter college name" required>
      </div>
      <div class="form-group">
        <label for="professionDetail">Profession Detail:</label>
        <input id="professionDetail" type="text" class="form-control" placeholder="Enter profession or current role">
      </div>
      <div class="form-group">
        <label for="skills">Skills:</label>
        <input id="skills" type="text" class="form-control" placeholder="Enter key skills">
      </div>
      <div class="form-group">
        <label for="resume">Resume:</label>
        <input id="resume" type="file" class="form-control-file">
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input id="password" type="password" class="form-control" placeholder="Enter password">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password:</label>
        <input id="confirmPassword" type="password" class="form-control" placeholder="Confirm password">
      </div>
      <button type="submit" class="btn btn-success btn-block">Register</button>
    </form>
  </div>
</div>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
